####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: jetbrains/qodana-jvm:2025.3
profile:
  name: qodana.recommended
  
projectJDK: "25"
  
include:
  - name: CheckDependencyLicenses
  - name: DuplicatedCode            # ← Duplacation Code - 123762 Rodrigo Couceiro
  - name: ParametersPerMethod       # ← Long Parameter List - 93263 Diogo Soares
  - name: FeatureEnvy               # ← Feature Envy - 123774 Ana Reganha

  # Brain Method - 111561 Tiago Bensusan
  #  BrainMethod aproximado utilizando inspections definidas pela extensão CodeMetrics - (CC >= 3 && LOC >= 30 && MND >= 3) 
  # Nota: Não é usado o NOAV (Number of accessed variables) pois  não existe uma inspection nativa para esta métrica
  # Inspections nativas ao qodana a serem usadas para  LOC, CC e MND respetivamente
       
  - name: CyclomaticComplexity  # ← ComplexMethod -> CC
  - name: NestingDepth # ← NestedDepth -> MND
  - name: NonCommentSourceStatements # ← LongMethod -> LOC

exclude:
  - name: All                    # ← desativa tudo o resto, corre só os do include

failureConditions:   
  severityThresholds:     
    any: 1
