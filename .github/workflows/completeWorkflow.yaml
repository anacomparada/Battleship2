name: Complete CI/CD Workflow

on:
  push:
    branches:
      - main

jobs:
  complete-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar dependências
        run: mvn dependency:resolve

      - name: Compilar o projeto
        run: mvn clean compile

      - name: Executar testes unitários
        run: mvn test

      - name: Validar qualidade no SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.ORG_KEY }}
            -Dsonar.java.binaries=target/classes

      - name: Quality Gate SonarQube Cloud
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagem Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/battleship-game:latest .

      - name: Publicar imagem no Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/battleship-game:latest

      - name: Gerar documentação
        run: mvn javadoc:javadoc

      - name: Atualizar documentação no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/site/apidocs
