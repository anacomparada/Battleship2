# Nº 111561 - Tiago Bensusan
# Code Smell: Brain Method
# Inspections:
# - OverlyLongMethod
# - OverlyComplexMethod
# - OverlyNestedMethod
# Limites através de inspection profile (.idea/inspectionProfiles/Brain_Method_Profile.xml):
# CC >= 3, LOC/NCSS >= 30, MND >= 3
# Nota: NOAV não é usado, não existe inspection nativa para o mesmo

name: "Code Smell - Brain Method"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  detect-brain-method:
    runs-on: ubuntu-latest
    name: "Detect Brain Method"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Run Qodana Scan
        uses: JetBrains/qodana-action@v2025.3
        with:
          pr-mode: false
          args: --save-report --config qodana-brain-method.yaml
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_2026785207 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brain-method-report
          path: ${{ runner.temp }}/qodana/results/
          retention-days: 14
